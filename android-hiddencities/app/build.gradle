plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.hiddencities.atlas'
    compileSdk 34

    defaultConfig {
        applicationId "com.hiddencities.atlas"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("HIDDENCITIES_KEYSTORE") ?: "${rootDir}/release.keystore"
            if (file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("HIDDENCITIES_KEYSTORE_PASS") ?: "hidden"
                keyAlias "hiddencities"
                keyPassword System.getenv("HIDDENCITIES_KEYSTORE_PASS") ?: "hidden"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file(System.getenv("HIDDENCITIES_KEYSTORE") ?: "${rootDir}/release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    testImplementation 'junit:junit:4.13.2'
}
