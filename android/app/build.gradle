plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.redalert.tsunami'
    compileSdk 34

    defaultConfig {
        applicationId "com.redalert.tsunami"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "1.2"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv("TSUNAMI_KEYSTORE") ?: "${rootDir}/release.keystore"
            if (file(ksFile).exists()) {
                storeFile file(ksFile)
                storePassword System.getenv("TSUNAMI_KEYSTORE_PASS") ?: "redalert"
                keyAlias "tsunami"
                keyPassword System.getenv("TSUNAMI_KEYSTORE_PASS") ?: "redalert"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (file(System.getenv("TSUNAMI_KEYSTORE") ?: "${rootDir}/release.keystore").exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
